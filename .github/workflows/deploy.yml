# Push sur master → reconstruction et mise en ligne
# https://dimvoyages.astratechnologie.com
#
# Secrets GitHub : VPS_HOST, VPS_USER, VPS_SSH_KEY
name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Production
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Copier et déployer
        env:
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts
          tar -czf /tmp/dimvoyages.tar.gz \
            --exclude=node_modules \
            --exclude=.next \
            --exclude=.git \
            --exclude=coverage \
            --exclude=.DS_Store \
            --exclude=.env \
            --exclude=.env.local \
            --exclude=deploiement/.env \
            --exclude=deploiement/.credentials \
            --exclude=public/uploads \
            .
          scp -o BatchMode=yes /tmp/dimvoyages.tar.gz "$USER@$HOST:dimvoyages.tar.gz"
          ssh -o BatchMode=yes -o ServerAliveInterval=15 -o ServerAliveCountMax=160 "$USER@$HOST" \
            'C:\Windows\System32\wsl.exe -d Ubuntu-24.04 -u root -- bash -lc "mkdir -p /opt/dimvoyages && tar -xzf /mnt/c/Users/Proxylab/dimvoyages.tar.gz -C /opt/dimvoyages && bash /opt/dimvoyages/deploiement/deployer.sh"'
